     <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            padding: 20px;
        }

        .card {
            width: 380px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .foto {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #243b55;
            margin-bottom: 15px;
        }

        h1 {
            color: #243b55;
            margin-bottom: 5px;
        }

        .kelas {
            color: #777;
            margin-bottom: 25px;
        }

        .data {
            text-align: left;
            background: #f2f4f7;
            border-radius: 15px;
            padding: 15px;
        }

        .data p {
            margin: 12px 0;
            color: #333;
        }

        .label {
            font-weight: bold;
            color: #243b55;
        }

        .footer {
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
